name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same checks to run by hand: the format gate, then both hosts evaluate.
      # Eval only -- no builds, no secrets, nothing installed.
      - run: nix fmt -- --fail-on-change
      - run: nix eval ".#nixosConfigurations.nixbox1.config.system.build.toplevel.drvPath"
      - run: nix eval ".#nixosConfigurations.nixbox2.config.system.build.toplevel.drvPath"
